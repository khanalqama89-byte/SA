# ======================================================================
# SA Document Converter Platform - H2 Embedded Database Profile
# Usage: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
# ======================================================================

spring.datasource.url=jdbc:h2:file:./target/data/sa_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.sa=INFO
logging.level.org.springframework.web=INFO
