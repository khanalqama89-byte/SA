# ======================================================================
# SA Document Converter Platform - Base Application Configuration
# ======================================================================

spring.application.name=sa-server
server.port=${SERVER_PORT:8080}

# Active profile: dev or prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Multipart upload limits (Default: 50MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:50MB}

# SA Custom File Storage Configuration
sa.storage.base-path=${STORAGE_BASE_PATH:../../storage}
sa.storage.max-file-size=${MAX_FILE_SIZE_BYTES:52428800}
sa.storage.expiry-hours=${STORAGE_FILE_EXPIRY_HOURS:24}

# SA JWT Security Configuration
sa.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
sa.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# SA CORS Configuration
sa.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# LibreOffice Executable Path
sa.libreoffice.path=${LIBREOFFICE_PATH:soffice}

# Async Thread Pool for Conversion Jobs
sa.async.core-pool-size=${CONVERSION_CORE_POOL_SIZE:4}
sa.async.max-pool-size=${CONVERSION_MAX_POOL_SIZE:8}
sa.async.queue-capacity=${CONVERSION_QUEUE_CAPACITY:100}

# Jackson JSON Formatter
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.time-zone=UTC
